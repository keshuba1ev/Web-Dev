<div class="card">
    <h2>All Albums</h2>

    <div *ngIf="loading" class="loading">Loading albums...</div>

    <div *ngIf="!loading" class="albums-list">
        <div *ngFor="let album of albums" class="album-item" [routerLink]="['/albums', album.id]">
            <span class="album-id">{{ album.id }}</span>
            <span class="album-title">{{ album.title }}</span>
            <button class="btn delete-btn" (click)="deleteAlbum(album.id, $event)">Delete</button>
        </div>
    </div>
</div>
