<div class="product-card" [style.animation-delay]="animationDelay" (clickOutside)="closeShareMenu()">

    <!-- Image Gallery -->
    <div class="product-image-wrapper">
        <div class="card-image-area" (click)="onImageClick()">
            <img [src]="getCurrentImage()" [alt]="product.name" class="product-image" loading="lazy" />
        </div>
        <div class="image-dots">
            <span *ngFor="let img of product.images; let j = index" class="dot" [class.active]="currentImageIndex === j"
                (click)="setImageIndex(j)">
            </span>
        </div>
        <span class="badge">Kaspi</span>
    </div>

    <!-- Product Info -->
    <div class="product-info">
        <a [href]="product.link" target="_blank" rel="noopener noreferrer" class="product-name-link">
            <h3 class="product-name">{{ product.name }}</h3>
        </a>
        <p class="product-description">{{ product.description }}</p>

        <!-- Rating -->
        <div class="product-rating">
            <div class="stars">
                <span *ngFor="let star of getStarArray(product.rating)" class="star" [ngClass]="star">
                    <svg *ngIf="star === 'full'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="currentColor" width="18" height="18">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                    <svg *ngIf="star === 'half'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                        height="18">
                        <defs>
                            <linearGradient id="halfGrad">
                                <stop offset="50%" stop-color="#FBBF24" />
                                <stop offset="50%" stop-color="#D1D5DB" />
                            </linearGradient>
                        </defs>
                        <path fill="url(#halfGrad)"
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                    <svg *ngIf="star === 'empty'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#D1D5DB"
                        width="18" height="18">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                    </svg>
                </span>
            </div>
            <span class="rating-number">{{ product.rating }}</span>
        </div>

        <!-- Price & Actions -->
        <div class="product-footer">
            <span class="product-price">{{ formatPrice(product.price) }}</span>
            <div class="action-buttons">
                <!-- Share Button -->
                <div class="share-wrapper">
                    <button class="share-btn" (click)="toggleShareMenu($event)" title="Поделиться">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3" />
                            <circle cx="6" cy="12" r="3" />
                            <circle cx="18" cy="19" r="3" />
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                        </svg>
                    </button>
                    <!-- Share Dropdown -->
                    <div class="share-dropdown" *ngIf="shareMenuOpen" (click)="$event.stopPropagation()">
                        <button class="share-option whatsapp" (click)="shareWhatsApp()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="currentColor">
                                <path
                                    d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
                            </svg>
                            <span>WhatsApp</span>
                        </button>
                        <button class="share-option telegram" (click)="shareTelegram()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="currentColor">
                                <path
                                    d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" />
                            </svg>
                            <span>Telegram</span>
                        </button>
                    </div>
                </div>
                <!-- Buy Button -->
                <a [href]="product.link" target="_blank" rel="noopener noreferrer" class="buy-btn">
                    Перейти
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 17L17 7M17 7H7M17 7V17" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</div>
